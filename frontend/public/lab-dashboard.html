<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lab Staff Dashboard – HMS</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
  <link rel="stylesheet" href="../assets/css/style.css" />
</head>
<body class="bg-gray-100 min-h-screen flex flex-col">
  <nav class="bg-white shadow-md">
    <div class="container mx-auto px-4 py-3 flex justify-between items-center">
      <div class="flex items-center space-x-2">
        <i class="fas fa-flask text-blue-600 text-2xl"></i>
        <span class="text-xl font-semibold text-gray-800">HMS – Lab Staff</span>
      </div>
      <div class="flex items-center space-x-4">
        <span id="userName" class="text-sm text-gray-600"></span>
        <button onclick="logout()" class="bg-red-500 hover:bg-red-600 text-white text-sm font-medium px-3 py-1 rounded transition">
          <i class="fas fa-sign-out-alt"></i> Logout
        </button>
      </div>
    </div>
  </nav>

  <main class="flex-grow container mx-auto px-4 py-6">
    <div id="errorMsg" class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded relative hidden mb-4"></div>
    <h2 class="text-2xl font-bold mb-4">Assigned Lab Requests</h2>
    <div id="requestList"></div>
  </main>

  <script type="module" src="../assets/js/labStaff/labStaff.js"></script>
  <script>
    window.logout = function() {
      localStorage.removeItem('token');
      localStorage.removeItem('user');
      window.location.href = '../public/index.html';
    };
  </script>
</body>
</html>
